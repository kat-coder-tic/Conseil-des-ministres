                                    <p style={{fontSize: '1.1em', marginBottom: '20px'}}>
                                        Vous avez terminé {gameState.completedScenarios.length} scénario(s) sur {Object.keys(SCENARIOS).length}.
                                        Relevez d'autres défis pour maîtriser toutes les situations économiques !
                                    </p>
                                    <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                        {Object.keys(SCENARIOS).filter(id => !gameState.completedScenarios.includes(id)).map(id => (
                                            <span key={id} style={{
                                                padding: '8px 15px',
                                                borderRadius: '20px',
                                                background: 'white',
                                                fontSize: '0.9em'
                                            }}>
                                                {SCENARIOS[id].name}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {gameState.completedScenarios && gameState.completedScenarios.length === Object.keys(SCENARIOS).length && (
                                <div style={{
                                    background: 'linear-gradient(135deg, #ffd700 0%, #ffed4e 100%)',
                                    padding: '40px',
                                    borderRadius: '12px',
                                    marginTop: '30px',
                                    border: '3px solid #ffd700',
                                    textAlign: 'center'
                                }}>
                                    <h2 style={{fontSize: '2.5em', marginBottom: '20px'}}>
                                        🏆 FÉLICITATIONS ! 🏆
                                    </h2>
                                    <p style={{fontSize: '1.3em', fontWeight: 'bold', marginBottom: '15px'}}>
                                        Vous avez terminé tous les scénarios !
                                    </p>
                                    <p style={{fontSize: '1.1em'}}>
                                        Vous maîtrisez maintenant toutes les facettes des politiques de l'emploi !
                                    </p>
                                </div>
                            )}
                            
                            <div className="action-buttons" style={{marginTop: '30px'}}>
                                <button className="btn btn-primary" onClick={backToScenarios}>
                                    Choisir un autre scénario
                                </button>
                                <button className="btn btn-secondary" onClick={resetGame}>
                                    Recommencer ce scénario
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing phase
            return (
                <div className="game-container">
                    {quizState && (
                        <FlashQuizModal
                            quizState={quizState}
                            onAnswer={answerQuiz}
                            onContinue={closeQuiz}
                            streak={quizStreak}
                        />
                    )}
                    {showGlossary && <GlossaryModal onClose={() => setShowGlossary(false)} />}
                    <button className="glossary-btn" onClick={() => setShowGlossary(true)}>
                        📖 Glossaire
                    </button>

                    <div className="game-header" style={{background:`linear-gradient(135deg, ${gameState.scenario?.color || '#1e3c72'} 0%, #2a5298 100%)`}}>
                        <h1>🏛️ {gameState.scenario?.name || 'Conseil des Ministres'}</h1>
                        <p>
                            Trimestre {gameState.quarter}/{gameState.totalQuarters || 8} — {gameState.quarter <= 4 ? 'Première année' : 'Seconde année'}
                            {quizCorrectTotal > 0 && (
                                <span className="quiz-streak">
                                    🧠 {quizCorrectTotal} bonne{quizCorrectTotal > 1 ? 's' : ''} réponse{quizCorrectTotal > 1 ? 's' : ''}
                                    {quizStreak >= 2 && ` 🔥×${quizStreak}`}
                                </span>
                            )}
                        </p>
                        <div className="header-code-bar">
                            <span className="header-code-label">🏆 Code équipe :</span>
                            <span className="header-code-value">{generateScoreCode()}</span>
                            <button
                                className={`header-code-copy ${codeCopiedHeader ? 'copied' : ''}`}
                                onClick={() => {
                                    const code = generateScoreCode();
                                    const name = gameState.scenario?.name?.replace(/[🔴🟡🟢🏭⚖️🔥]/gu,'').trim() || '';
                                    navigator.clipboard?.writeText(`Code : ${code} | ${name} | T${gameState.quarter}/8 | Chômage : ${gameState.indicators.chomage?.toFixed(1)}%`).catch(()=>{});
                                    setCodeCopiedHeader(true);
                                    setTimeout(() => setCodeCopiedHeader(false), 2200);
                                }}
                            >
                                {codeCopiedHeader ? '✅ Copié !' : '📋 Copier'}
                            </button>
                            <a className="header-code-prof-link" href="decoder.html" target="_blank" rel="noopener">
                                Espace enseignant →
                            </a>
                        </div>
                    </div>

                    <MultiObjectivesPanel
                        scenario={gameState.scenario}
                        indicators={gameState.indicators}
                        quarter={gameState.quarter}
                        totalQuarters={gameState.totalQuarters || 8}
                    />
                    
                    {gameState.quarterlyRevenue && (
                        <div style={{
                            margin: '0 30px 20px 30px',
                            padding: '15px 20px',
                            background: 'linear-gradient(135deg, #28a745 0%, #20c997 100%)',
                            color: 'white',
                            borderRadius: '12px',
                            textAlign: 'center',
                            fontWeight: 'bold',
                            fontSize: '1.1em',
                            boxShadow: '0 4px 12px rgba(40, 167, 69, 0.3)',
                            animation: 'slideIn 0.5s ease-out'
                        }}>
                            💰 Recettes fiscales du trimestre : +{gameState.quarterlyRevenue}% de budget
                            <div style={{fontSize: '0.85em', marginTop: '5px', opacity: 0.9}}>
                                (Impôts, cotisations sociales, taxes...)
                            </div>
                        </div>
                    )}
                    
                    <CollapsibleDashboard indicators={gameState.indicators} expanded={dashExpanded} setExpanded={setDashExpanded} />

                    <div className="playing-layout">
                        <div className="playing-main">
                            <div className="game-phase">
                                <h2 className="phase-title">
                                    Choisissez jusqu'à 3 mesures ({gameState.selectedPolicies.length}/3 sélectionnées)
                                </h2>

                                <PolicyFiltersWrapper
                                    indicators={gameState.indicators}
                                    selectedPolicies={gameState.selectedPolicies}
                                    togglePolicy={togglePolicy}
                                />
                                
                                <div className="action-buttons">
                                    <button 
                                        className="btn btn-primary" 
                                        onClick={executeQuarter}
                                        disabled={gameState.selectedPolicies.length === 0}
                                    >
                                        Valider et passer au trimestre suivant
                                    </button>
                                    <button className="btn btn-secondary" onClick={resetGame}>
                                        Recommencer
                                    </button>
                                </div>
                            </div>
                        </div>

                        <ActionJournal history={gameState.history} scenario={gameState.scenario} />
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           FLASH QUIZ MODAL
           ───────────────────────────────────────────── */
        function FlashQuizModal({ quizState, onAnswer, onContinue, streak }) {
            const { question: q, answered, selected } = quizState;
            const letters = ['A', 'B', 'C', 'D'];

            return (
                <div className="quiz-overlay">
                    <div className="quiz-modal">
                        <div className="quiz-source">{q.source}</div>
                        <div className="quiz-question">{q.question}</div>

                        <div className="quiz-options">
                            {q.options.map((opt, idx) => {
                                let cls = '';
                                if (answered) {
                                    if (idx === q.correct) cls = idx === selected ? 'correct' : 'revealed';
                                    else if (idx === selected) cls = 'wrong';
                                }
                                return (
                                    <button
                                        key={idx}
                                        className={`quiz-option ${cls}`}
                                        onClick={() => onAnswer(idx)}
                                        disabled={answered}
                                    >
                                        <span className="quiz-option-letter">{letters[idx]}</span>
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>

                        {answered && (
                            <div className={`quiz-feedback ${selected === q.correct ? 'good' : 'bad'}`}>
                                <span style={{fontSize:'1.4em'}}>{selected === q.correct ? '✅' : '💡'}</span>
                                <div>
                                    <strong>{selected === q.correct ? 'Bonne réponse !' : 'Pas tout à fait…'}</strong>
                                    {selected === q.correct && q.bonusValue && (
                                        <span className="quiz-bonus">+{q.bonusValue} popularité 🎉</span>
                                    )}
                                    {streak >= 3 && selected === q.correct && (
                                        <span className="quiz-bonus" style={{marginLeft:'6px',background:'linear-gradient(135deg,#fd7e14,#ffc107)'}}>🔥 Série ×{streak}</span>
                                    )}
                                    <div style={{marginTop:'8px'}}>{q.explanation}</div>
                                </div>
                            </div>
                        )}

                        {answered ? (
                            <button className="quiz-continue" onClick={onContinue}>
                                Continuer → Trimestre suivant
                            </button>
                        ) : (
                            <div style={{textAlign:'center'}}>
                                <button className="quiz-skip" onClick={onContinue}>Passer cette question</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           COLLAPSIBLE DASHBOARD (Priorité 3)
           Affiche d'abord les indicateurs critiques,
           bouton pour tout voir.
           ───────────────────────────────────────────── */
        function CollapsibleDashboard({ indicators, expanded, setExpanded }) {
            const v = (key, fallback) => indicators[key] != null ? indicators[key] : fallback;

            // Détecte les indicateurs en alerte
            const alerts = {
                chomage:   indicators.chomage > 12 ? 'critical' : indicators.chomage > 9 ? 'warning' : '',
                deficit:   v('deficit',3) > 5      ? 'critical' : v('deficit',3) > 3 ? 'warning' : '',
                budget:    indicators.budget < 30   ? 'critical' : indicators.budget < 50 ? 'warning' : '',
                pauvrete:  v('pauvrete',10) > 14    ? 'critical' : v('pauvrete',10) > 10 ? 'warning' : '',
                inflation: v('inflation',1.5) > 4   ? 'critical' : v('inflation',1.5) > 2.5 ? 'warning' : '',
                popularite:v('popularite',50) < 25  ? 'critical' : v('popularite',50) < 40 ? 'warning' : '',
            };
            const hasAlerts = Object.values(alerts).some(a => a === 'critical');

            const getTrend = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return 'stable';
                return inverse ? (diff > 0 ? 'down' : 'up') : (diff > 0 ? 'up' : 'down');
            };
            const getTrendText = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return '→';
                const symbol = inverse ? (diff > 0 ? '↓' : '↑') : (diff > 0 ? '↑' : '↓');
                return `${symbol} ${Math.abs(diff).toFixed(1)}`;
            };
            const initial = INITIAL_STATE.indicators;

            const priorityCards = (
                <React.Fragment>
                    <div className={`indicator ${alerts.chomage}`}>
                        <div className="indicator-label">Taux de chômage</div>
                        <div className="indicator-value" style={{color: indicators.chomage > 10 ? '#dc3545' : '#28a745'}}>
                            {indicators.chomage.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.chomage, initial.chomage, true)}`}>
                            {getTrendText(indicators.chomage, initial.chomage, true)}
                        </span>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Taux d'emploi</div>
                        <div className="indicator-value" style={{color: indicators.emploi > 70 ? '#28a745' : '#ffc107'}}>
                            {indicators.emploi.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.emploi, initial.emploi)}`}>
                            {getTrendText(indicators.emploi, initial.emploi)}
                        </span>
                    </div>
                    <div className={`indicator ${alerts.budget}`}>
                        <div className="indicator-label">Budget de l'État</div>
                        <div className="indicator-value" style={{color: indicators.budget > 50 ? '#28a745' : '#dc3545'}}>
                            {indicators.budget.toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.budget, initial.budget)}`}>
                            {getTrendText(indicators.budget, initial.budget)}
                        </span>
                    </div>
                    <div className={`indicator ${alerts.deficit}`}>
                        <div className="indicator-label">Déficit Public</div>
                        <div className="indicator-value" style={{color: v('deficit',3) < 3 ? '#28a745' : '#dc3545'}}>
                            {v('deficit',3).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('deficit',3), initial.deficit, true)}`}>
                            {getTrendText(v('deficit',3), initial.deficit, true)}
                        </span>
                    </div>
                    <div className={`indicator ${alerts.popularite}`}>
                        <div className="indicator-label">Popularité</div>
                        <div className="indicator-value" style={{color: v('popularite',50) > 50 ? '#28a745' : '#dc3545'}}>
                            {v('popularite',50).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('popularite',50), initial.popularite)}`}>
                            {getTrendText(v('popularite',50), initial.popularite)}
                        </span>
                    </div>
                </React.Fragment>
            );

            const extraCards = (
                <React.Fragment>
                    <div className="indicator">
                        <div className="indicator-label">Taux d'activité</div>
                        <div className="indicator-value" style={{color: '#17a2b8'}}>{indicators.activite.toFixed(1)}%</div>
                        <span className={`indicator-trend trend-${getTrend(indicators.activite, initial.activite)}`}>
                            {getTrendText(indicators.activite, initial.activite)}
                        </span>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Entreprises</div>
                        <div className="indicator-value" style={{color: '#6f42c1'}}>{indicators.entreprises}/100</div>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Salariés</div>
                        <div className="indicator-value" style={{color: '#fd7e14'}}>{indicators.salaries}/100</div>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Croissance</div>
                        <div className="indicator-value" style={{color: v('croissance',1.5) > 1.5 ? '#28a745' : '#ffc107'}}>
                            {v('croissance',1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('croissance',1.5), initial.croissance)}`}>
                            {getTrendText(v('croissance',1.5), initial.croissance)}
                        </span>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Dette Publique</div>
                        <div className="indicator-value" style={{color: v('dette',85) < 90 ? '#28a745' : '#ffc107'}}>
                            {v('dette',85).toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('dette',85), initial.dette, true)}`}>
                            {getTrendText(v('dette',85), initial.dette, true)}
                        </span>
                    </div>
                    <div className={`indicator ${alerts.inflation}`}>
                        <div className="indicator-label">Inflation</div>
                        <div className="indicator-value" style={{color: v('inflation',1.5) < 2.5 ? '#28a745' : '#dc3545'}}>
                            {v('inflation',1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('inflation',1.5), initial.inflation, true)}`}>
                            {getTrendText(v('inflation',1.5), initial.inflation, true)}
                        </span>
                    </div>
                    <div className={`indicator ${alerts.pauvrete}`}>
                        <div className="indicator-label">Taux de Pauvreté</div>
                        <div className="indicator-value" style={{color: v('pauvrete',10) < 10 ? '#28a745' : '#dc3545'}}>
                            {v('pauvrete',10).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('pauvrete',10), initial.pauvrete, true)}`}>
                            {getTrendText(v('pauvrete',10), initial.pauvrete, true)}
                        </span>
                    </div>
                    <div className="indicator">
                        <div className="indicator-label">Inégalités</div>
                        <div className="indicator-value" style={{color: v('inegalites',30) < 30 ? '#28a745' : '#ffc107'}}>
                            {v('inegalites',30).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('inegalites',30), initial.inegalites, true)}`}>
                            {getTrendText(v('inegalites',30), initial.inegalites, true)}
                        </span>
                    </div>
                </React.Fragment>
            );

            return (
                <div>
                    <div className="dashboard">
                        {priorityCards}
                        {expanded && extraCards}
                    </div>
                    <div className="dashboard-toggle-bar" onClick={() => setExpanded(e => !e)}>
                        <button className="dashboard-toggle-btn">
                            {hasAlerts && !expanded && <span className="dashboard-alert-dot"/>}
                            {expanded ? '▲ Réduire le tableau de bord' : `▼ Voir les 8 autres indicateurs${hasAlerts ? ' ⚠️' : ''}`}
                        </button>
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           GLOSSAIRE
           ───────────────────────────────────────────── */
        function GlossaryModal({ onClose }) {
            const [search, setSearch] = React.useState('');
            const [cat, setCat]       = React.useState('all');

            const CATS = [
                { key: 'all',      label: 'Tous' },
                { key: 'emploi',   label: '💼 Emploi' },
                { key: 'economie', label: '💰 Économie' },
                { key: 'budget',   label: '📉 Budget' },
                { key: 'social',   label: '🏥 Social' },
                { key: 'europe',   label: '🇪🇺 Europe' },
            ];

            const filtered = GLOSSARY.filter(g => {
                const matchCat  = cat === 'all' || g.category === cat;
                const q = search.toLowerCase();
                const matchSearch = !q || g.term.toLowerCase().includes(q) || g.definition.toLowerCase().includes(q);
                return matchCat && matchSearch;
            });

            return (
                <div className="glossary-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                    <div className="glossary-modal">
                        <div className="glossary-header">
                            <h2>📖 Glossaire Économique</h2>
                            <button className="glossary-close" onClick={onClose}>✕</button>
                        </div>
                        <div className="glossary-search">
                            <input
                                type="text"
                                placeholder="Rechercher un terme..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                autoFocus
                            />
                            {CATS.map(c => (
                                <button key={c.key} className={`gloss-cat-btn ${cat === c.key ? 'active' : ''}`}
                                    onClick={() => setCat(c.key)}>
                                    {c.label}
                                </button>
                            ))}
                        </div>
                        <div className="glossary-body">
                            {filtered.length === 0 && (
                                <div style={{textAlign:'center',color:'#999',padding:'40px'}}>
                                    Aucun terme trouvé pour cette recherche.
                                </div>
                            )}
                            {filtered.map(g => (
                                <div key={g.term} className="gloss-entry">
                                    <div className="gloss-entry-header">
                                        <span className="gloss-term">{g.term}</span>
                                        <span className="gloss-theme">{g.theme}</span>
                                    </div>
                                    <div className="gloss-def">{g.definition}</div>
                                    <div className="gloss-example">{g.example}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           BARRE MINISTRES (filtrage des politiques)
           ───────────────────────────────────────────── */
        function MinistersBar({ activeMinister, onSelect, selectedPolicies, indicators }) {
            return (
                <div>
                    <div className="ministers-bar">
                        <button
                            className={`minister-tab ${activeMinister === 'all' ? 'active' : ''}`}
                            style={activeMinister === 'all' ? {backgroundColor:'#2a5298', borderBottomColor:'#2a5298'} : {}}
                            onClick={() => onSelect('all')}
                        >
                            🏛️ Conseil des ministres
                            <span className="minister-quota">{selectedPolicies.length}/3</span>
                        </button>
                        {MINISTERS.map(m => {
                            const ministerPolicies = selectedPolicies.filter(id => {
                                const p = POLICIES_BY_ID[id];
                                return p && m.policyTypes.includes(p.type);
                            });
                            const isActive = activeMinister === m.id;
                            return (
                                <button
                                    key={m.id}
                                    className={`minister-tab ${isActive ? 'active' : ''}`}
                                    style={isActive ? {backgroundColor: m.color, borderBottomColor: m.color} : {}}
                                    onClick={() => onSelect(m.id)}
                                >
                                    {m.icon} {m.name.replace('Ministre ', '').replace('de l\'', 'de l\'')}
                                    <span className="minister-quota">{ministerPolicies.length}/{m.maxPolicies}</span>
                                </button>
                            );
                        })}
                    </div>
                    {activeMinister !== 'all' && (() => {
                        const m = MINISTERS.find(x => x.id === activeMinister);
                        return m ? (
                            <div className="minister-context">
                                <span style={{fontSize:'1.2em'}}>{m.icon}</span>
                                <span><strong>{m.name}</strong> — {m.description}</span>
                                <span style={{marginLeft:'auto',color:'#2a5298',fontWeight:700}}>
                                    Max {m.maxPolicies} mesure{m.maxPolicies > 1 ? 's' : ''} dans son portefeuille
                                </span>
                            </div>
                        ) : null;
                    })()}
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           MULTI-OBJECTIFS PANEL
           ───────────────────────────────────────────── */
        function MultiObjectivesPanel({ scenario, indicators, quarter, totalQuarters }) {
            if (!scenario || !scenario.multiObjectives) return null;
            const trimLeft = totalQuarters - quarter + 1;
            return (
                <div className="multi-obj-panel">
                    <span style={{color:'rgba(255,255,255,0.7)',fontSize:'0.8em',fontWeight:700,whiteSpace:'nowrap'}}>
                        🎯 OBJECTIFS · {trimLeft} trim. restants
                    </span>
                    {scenario.multiObjectives.map(obj => {
                        const val = indicators[obj.key];
                        const achieved = val != null && (obj.inverse ? val < obj.threshold : val > obj.threshold);
                        const danger   = val != null && (obj.inverse ? val > obj.threshold * 1.15 : val < obj.threshold * 0.85);
                        return (
                            <div key={obj.key} className={`multi-obj-item ${achieved ? 'achieved' : danger ? 'danger' : ''}`}>
                                {achieved ? '✅' : danger ? '🔴' : '⏳'}
                                <strong>{obj.label}</strong>
                                <span style={{opacity:0.8}}>{val != null ? (Number.isInteger(val) ? val : val.toFixed(1)) : '–'}</span>
                                <span style={{opacity:0.6,fontSize:'0.85em'}}>→ {obj.target}</span>
                            </div>
                        );
                    })}
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           POLICY FILTERS WRAPPER (owns filtered state)
           ───────────────────────────────────────────── */
        const POLICIES_BY_ID = {};
        POLICIES.forEach(p => { POLICIES_BY_ID[p.id] = p; });

        function PolicyFiltersWrapper({ indicators, selectedPolicies, togglePolicy }) {
            const [filteredPolicies, setFilteredPolicies] = React.useState(POLICIES);
            const [activeMinister, setActiveMinister]     = React.useState('all');

            const IND_LABELS = {
                chomage:'Chômage', emploi:'Emploi', budget:'Budget', croissance:'Croissance',
                deficit:'Déficit', dette:'Dette', inflation:'Inflation', pauvrete:'Pauvreté',
                inegalites:'Inégalités', popularite:'Popularité', entreprises:'Entreprises',
                salaries:'Salariés', activite:'Activité'
            };

            const policiesForMinister = activeMinister === 'all'
                ? POLICIES
                : (() => {
                    const m = MINISTERS.find(x => x.id === activeMinister);
                    return m ? POLICIES.filter(p => m.policyTypes.includes(p.type)) : POLICIES;
                })();

            return (
                <div>
                    <MinistersBar
                        activeMinister={activeMinister}
                        onSelect={setActiveMinister}
                        selectedPolicies={selectedPolicies}
                        indicators={indicators}
                    />

                    <div style={{padding:'0'}}>
                        <PolicyFilters
                            policies={policiesForMinister}
                            budget={indicators.budget}
                            selectedPolicies={selectedPolicies}
                            onFiltered={setFilteredPolicies}
                            key={activeMinister}
                        />

                        {filteredPolicies.length === 0 && (
                            <div style={{textAlign:'center', padding:'40px', color:'#888', fontSize:'1.05em'}}>
                                Aucune politique ne correspond à ce filtre.
                            </div>
                        )}

                        <div className="policies-grid">
                            {filteredPolicies.map(policy => {
                                const isSelected = selectedPolicies.includes(policy.id);
                                const isDisabled = !isSelected && selectedPolicies.length >= 3;
                                const canAfford  = indicators.budget >= policy.cost;
                                const minister   = MINISTERS.find(m => m.policyTypes.includes(policy.type));
                                const ministerCount = minister
                                    ? selectedPolicies.filter(id => { const p = POLICIES_BY_ID[id]; return p && minister.policyTypes.includes(p.type); }).length
                                    : 0;
                                const overQuota = minister && !isSelected && ministerCount >= minister.maxPolicies;

                                return (
                                    <div
                                        key={policy.id}
                                        className={`policy-card ${isSelected ? 'selected' : ''} ${(isDisabled || !canAfford || overQuota) ? 'disabled' : ''}`}
                                        onClick={() => canAfford && !isDisabled && !overQuota ? togglePolicy(policy.id) : null}
                                    >
                                        <span className={`policy-type type-${policy.type}`}>{policy.type}</span>
                                        <span className="policy-cost">💰 {policy.cost}%</span>
                                        <div className="policy-name">{policy.name}</div>
                                        <div className="policy-description">{policy.description}</div>
                                        <div className="policy-impacts">
                                            {Object.entries(policy.impacts).map(([key, value]) => (
                                                <span key={key} className={`impact-badge ${value > 0 ? 'impact-positive' : 'impact-negative'}`}>
                                                    {IND_LABELS[key] || key} {value > 0 ? '+' : ''}{value}
                                                </span>
                                            ))}
                                        </div>
                                        {!canAfford && <div style={{color:'#dc3545',marginTop:'10px',fontWeight:'bold'}}>Budget insuffisant</div>}
                                        {overQuota && canAfford && (
                                            <div style={{color:'#fd7e14',marginTop:'10px',fontWeight:'bold',fontSize:'0.85em'}}>
                                                ⚠️ Quota {minister.icon} atteint ({minister.maxPolicies} max)
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           POLICY FILTERS & SORT
           ───────────────────────────────────────────── */
        function PolicyFilters({ policies, budget, selectedPolicies, onFiltered }) {
            const [activeType, setActiveType]   = React.useState('all');
            const [activeExtra, setActiveExtra] = React.useState(null); // 'affordable' | 'selected'
            const [sortBy, setSortBy]           = React.useState('default');

            const TYPE_FILTERS = [
                { key: 'all',        label: 'Toutes',      cls: 'fb-all' },
                { key: 'active',     label: '💼 Actives',   cls: 'fb-active' },
                { key: 'passive',    label: '🛡️ Passives',  cls: 'fb-passive' },
                { key: 'demande',    label: '📈 Demande',   cls: 'fb-demande' },
                { key: 'offre',      label: '🏭 Offre',     cls: 'fb-offre' },
                { key: 'economie',   label: '💰 Économie',  cls: 'fb-economie' },
                { key: 'social',     label: '🏥 Social',    cls: 'fb-social' },
                { key: 'education',  label: '🎓 Éducation', cls: 'fb-education' },
            ];

            const SORT_OPTIONS = [
                { value: 'default',   label: 'Ordre par défaut' },
                { value: 'cost-asc',  label: 'Coût croissant' },
                { value: 'cost-desc', label: 'Coût décroissant' },
                { value: 'impact',    label: 'Impact total ↑' },
                { value: 'name',      label: 'Alphabétique' },
            ];

            // Indicator label map for tooltip-friendly display
            const IND_LABELS = {
                chomage:'Chômage', emploi:'Emploi', budget:'Budget', croissance:'Croissance',
                deficit:'Déficit', dette:'Dette', inflation:'Inflation', pauvrete:'Pauvreté',
                inegalites:'Inégalités', popularite:'Popularité', entreprises:'Entreprises',
                salaries:'Salariés', activite:'Activité'
            };

            const impactTotal = p => Object.values(p.impacts).reduce((s, v) => s + Math.abs(v), 0);

            React.useEffect(() => {
                let result = [...policies];

                // Type filter
                if (activeType !== 'all') result = result.filter(p => p.type === activeType);

                // Extra filters
                if (activeExtra === 'affordable') result = result.filter(p => budget >= p.cost);
                if (activeExtra === 'selected')   result = result.filter(p => selectedPolicies.includes(p.id));

                // Sort
                if (sortBy === 'cost-asc')  result.sort((a, b) => a.cost - b.cost);
                if (sortBy === 'cost-desc') result.sort((a, b) => b.cost - a.cost);
                if (sortBy === 'impact')    result.sort((a, b) => impactTotal(b) - impactTotal(a));
                if (sortBy === 'name')      result.sort((a, b) => a.name.localeCompare(b.name));

                onFiltered(result);
            }, [activeType, activeExtra, sortBy, selectedPolicies.length, budget]);

            const toggleExtra = key => setActiveExtra(prev => prev === key ? null : key);

            return (
                <div className="filters-bar">
                    <span className="filter-label">Filtrer :</span>
                    <div className="filter-group">
                        {TYPE_FILTERS.map(f => (
                            <button
                                key={f.key}
                                className={`filter-btn ${f.cls} ${activeType === f.key ? 'active' : ''}`}
                                onClick={() => setActiveType(f.key)}
                            >
                                {f.label}
                            </button>
                        ))}
                    </div>

                    <div className="filter-group" style={{borderLeft:'2px solid #d0d8ff', paddingLeft:'10px'}}>
                        <button
                            className={`filter-btn fb-affordable ${activeExtra === 'affordable' ? 'active' : ''}`}
                            onClick={() => toggleExtra('affordable')}
                            title="Afficher uniquement les politiques que vous pouvez financer"
                        >
                            💳 Finançables
                        </button>
                        <button
                            className={`filter-btn fb-selected ${activeExtra === 'selected' ? 'active' : ''}`}
                            onClick={() => toggleExtra('selected')}
                            title="Afficher uniquement les politiques déjà sélectionnées"
                        >
                            ✅ Sélectionnées ({selectedPolicies.length})
                        </button>
                    </div>

                    <div className="filter-group" style={{borderLeft:'2px solid #d0d8ff', paddingLeft:'10px'}}>
                        <span className="filter-label">Trier :</span>
                        <select className="sort-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                            {SORT_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           OBJECTIVES PANEL
           ───────────────────────────────────────────── */
        function ObjectivesPanel({ gameState }) {
            const scenario = gameState.scenario;
            if (!scenario) return null;
            const ind = gameState.indicators;
            const initial = scenario.initialState;

            const objectives = [
                {
                    label: 'Chômage',
                    icon: '🎯',
                    current: ind.chomage.toFixed(1) + '%',
                    target: '< ' + scenario.targetChomage + '%',
                    achieved: ind.chomage < scenario.targetChomage,
                    danger: ind.chomage > initial.chomage
                },
                {
                    label: 'Emploi',
                    icon: '💼',
                    current: ind.emploi.toFixed(1) + '%',
                    target: '> ' + initial.emploi + '%',
                    achieved: ind.emploi > initial.emploi + 2,
                    danger: ind.emploi < initial.emploi
                },
                {
                    label: 'Budget',
                    icon: '💰',
                    current: ind.budget.toFixed(0) + '%',
                    target: '> 30%',
                    achieved: ind.budget > 60,
                    danger: ind.budget < 30
                },
                {
                    label: 'Déficit',
                    icon: '📉',
                    current: (ind.deficit || 3).toFixed(1) + '%',
                    target: '< 3%',
                    achieved: (ind.deficit || 3) < 3,
                    danger: (ind.deficit || 3) > 5
                }
            ];

            const trimLeft = gameState.totalQuarters - gameState.quarter + 1;

            return (
                <div className="objectives-panel">
                    <div className="obj-title">🎯 OBJECTIFS<br/><span style={{fontWeight:400,fontSize:'0.85em'}}>{trimLeft > 0 ? trimLeft + ' trim. restants' : 'Dernier trim.'}</span></div>
                    {objectives.map(obj => (
                        <div key={obj.label} className={`obj-item ${obj.achieved ? 'achieved' : obj.danger ? 'danger' : ''}`}>
                            <span>{obj.icon}</span>
                            <span><strong>{obj.label}</strong><br/>{obj.current} <span style={{opacity:0.7}}>→ {obj.target}</span></span>
                            <span>{obj.achieved ? '✅' : obj.danger ? '🔴' : '⏳'}</span>
                        </div>
                    ))}
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           MINI CHART (SVG sparkline)
           ───────────────────────────────────────────── */
        function MiniChart({ history, selectedIndicator, scenario }) {
            if (!history || history.length === 0) {
                return <div style={{textAlign:'center',color:'#999',fontSize:'0.85em',padding:'20px 0'}}>Jouez un trimestre pour voir l'évolution</div>;
            }

            const CHART_INDICATORS = [
                { key: 'chomage',  label: 'Chômage',  color: '#dc3545', inverse: true },
                { key: 'emploi',   label: 'Emploi',   color: '#28a745', inverse: false },
                { key: 'budget',   label: 'Budget',   color: '#2a5298', inverse: false },
                { key: 'croissance', label: 'Croissance', color: '#17a2b8', inverse: false },
                { key: 'deficit',  label: 'Déficit',  color: '#fd7e14', inverse: true },
                { key: 'pauvrete', label: 'Pauvreté', color: '#6c757d', inverse: true },
            ];

            const ind = CHART_INDICATORS.find(i => i.key === selectedIndicator) || CHART_INDICATORS[0];

            // Build data series: initial value + each quarter
            const initial = scenario?.initialState?.[ind.key] ?? 0;
            const points = [initial, ...history.map(h => h.indicators[ind.key] ?? initial)];

            const W = 240, H = 90, PAD = 14;
            const minV = Math.min(...points) - 1;
            const maxV = Math.max(...points) + 1;
            const range = maxV - minV || 1;

            const toX = i => PAD + (i / (points.length - 1)) * (W - PAD * 2);
            const toY = v => PAD + (1 - (v - minV) / range) * (H - PAD * 2);

            const pathD = points.map((v, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(v).toFixed(1)}`).join(' ');
            const areaD = `${pathD} L ${toX(points.length - 1).toFixed(1)} ${H - PAD} L ${toX(0).toFixed(1)} ${H - PAD} Z`;

            const lastVal = points[points.length - 1];
            const firstVal = points[0];
            const delta = lastVal - firstVal;
            const deltaStr = (delta >= 0 ? '+' : '') + delta.toFixed(1);
            const goodDelta = ind.inverse ? delta < 0 : delta > 0;

            return (
                <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                        <span style={{fontSize:'0.8em',fontWeight:700,color:ind.color}}>{ind.label}</span>
                        <span style={{fontSize:'0.8em',fontWeight:700,color: goodDelta ? '#28a745' : delta === 0 ? '#888' : '#dc3545'}}>
                            {deltaStr}
                        </span>
                    </div>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'80px'}}>
                        <defs>
                            <linearGradient id={`grad-${ind.key}`} x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor={ind.color} stopOpacity="0.3"/>
                                <stop offset="100%" stopColor={ind.color} stopOpacity="0"/>
                            </linearGradient>
                        </defs>
                        <path d={areaD} fill={`url(#grad-${ind.key})`}/>
                        <path d={pathD} fill="none" stroke={ind.color} strokeWidth="2" strokeLinejoin="round"/>
                        {points.map((v, i) => (
                            <circle key={i} cx={toX(i)} cy={toY(v)} r="3" fill={ind.color}/>
                        ))}
                        {/* Y labels */}
                        <text x={PAD - 2} y={PAD + 4} fontSize="8" fill="#999" textAnchor="end">{maxV.toFixed(0)}</text>
                        <text x={PAD - 2} y={H - PAD + 4} fontSize="8" fill="#999" textAnchor="end">{minV.toFixed(0)}</text>
                        {/* X labels T1 T2... */}
                        {points.map((_, i) => i > 0 && (
                            <text key={i} x={toX(i)} y={H - 2} fontSize="8" fill="#999" textAnchor="middle">T{i}</text>
                        ))}
                    </svg>
                </div>
            );
        }

        /* ─────────────────────────────────────────────
           ACTION JOURNAL (sidebar)
           ───────────────────────────────────────────── */
        function ActionJournal({ history, scenario }) {
            const [activeChart, setActiveChart] = React.useState('chomage');

            const CHART_TABS = [
                {key:'chomage', label:'Chômage'},
                {key:'emploi', label:'Emploi'},
                {key:'budget', label:'Budget'},
                {key:'croissance', label:'Croissance'},
                {key:'deficit', label:'Déficit'},
                {key:'pauvrete', label:'Pauvreté'},
            ];

            const LABEL = {
                chomage:'Chômage', emploi:'Emploi', activite:'Activité', budget:'Budget',
                croissance:'Croissance', deficit:'Déficit', dette:'Dette', inflation:'Inflation',
                pauvrete:'Pauvreté', inegalites:'Inégalités', popularite:'Popularité',
                entreprises:'Entreprises', salaries:'Salariés'
            };

            const getIndDelta = (entry, idx, allHistory) => {
                if (idx === 0) return {};
                const prev = allHistory[idx - 1].indicators;
                const curr = entry.indicators;
                const deltas = {};
                Object.keys(curr).forEach(k => {
                    const d = curr[k] - prev[k];
                    if (Math.abs(d) >= 0.4) deltas[k] = d;
                });
                return deltas;
            };

            return (
                <div className="playing-sidebar">
                    <div className="chart-panel">
                        <h3>📈 Évolution</h3>
                        <div className="chart-tabs">
                            {CHART_TABS.map(t => (
                                <button key={t.key} className={`chart-tab ${activeChart === t.key ? 'active' : ''}`} onClick={() => setActiveChart(t.key)}>
                                    {t.label}
                                </button>
                            ))}
                        </div>
                        <MiniChart history={history} selectedIndicator={activeChart} scenario={scenario}/>
                    </div>

                    <div className="journal-panel">
                        <h3>📋 Journal des actions</h3>
                        {history.length === 0 && (
                            <div style={{color:'#999',fontSize:'0.85em',textAlign:'center',paddingTop:'10px'}}>
                                Vos décisions apparaîtront ici après chaque trimestre.
                            </div>
                        )}
                        {[...history].reverse().map((entry, revIdx) => {
                            const idx = history.length - 1 - revIdx;
                            const deltas = getIndDelta(entry, idx, history);
                            return (
                                <div key={entry.quarter} className={`journal-entry ${entry.event ? 'has-event' : ''}`}>
                                    <div className="journal-quarter-label">Trimestre {entry.quarter}</div>
                                    <div>
                                        {entry.policies.map(p => (
                                            <span key={p.id} className="journal-policy-tag">{p.name}</span>
                                        ))}
                                    </div>
                                    {entry.event && (
                                        <div>
                                            <span className="journal-event-tag">{entry.event.icon} {entry.event.name}</span>
                                        </div>
                                    )}
                                    {Object.keys(deltas).length > 0 && (
                                        <div className="journal-indicators">
                                            {Object.entries(deltas).slice(0,6).map(([k, d]) => (
                                                <div key={k} className="journal-ind-item">
                                                    <span className={d > 0 ? 'ind-up' : 'ind-down'}>
                                                        {d > 0 ? '↑' : '↓'} {LABEL[k] || k}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function Dashboard({ indicators }) {
            const getTrend = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return 'stable';
                return inverse ? (diff > 0 ? 'down' : 'up') : (diff > 0 ? 'up' : 'down');
            };

            const getTrendText = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return '→';
                const symbol = inverse ? (diff > 0 ? '↓' : '↑') : (diff > 0 ? '↑' : '↓');
                return `${symbol} ${Math.abs(diff).toFixed(1)}`;
            };

            const initial = INITIAL_STATE.indicators;

            // Safe accessor: returns the value even if 0 (fixes the || bug)
            const v = (key, fallback) => indicators[key] != null ? indicators[key] : fallback;

            return (
                <div className="dashboard">
                    <div className="indicator">
                        <div className="indicator-label">Taux de chômage</div>
                        <div className="indicator-value" style={{color: indicators.chomage > 10 ? '#dc3545' : '#28a745'}}>
                            {indicators.chomage.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.chomage, initial.chomage, true)}`}>
                            {getTrendText(indicators.chomage, initial.chomage, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux d'emploi</div>
                        <div className="indicator-value" style={{color: indicators.emploi > 70 ? '#28a745' : '#ffc107'}}>
                            {indicators.emploi.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.emploi, initial.emploi)}`}>
                            {getTrendText(indicators.emploi, initial.emploi)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux d'activité</div>
                        <div className="indicator-value" style={{color: '#17a2b8'}}>
                            {indicators.activite.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.activite, initial.activite)}`}>
                            {getTrendText(indicators.activite, initial.activite)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Budget de l'État</div>
                        <div className="indicator-value" style={{color: indicators.budget > 50 ? '#28a745' : '#dc3545'}}>
                            {indicators.budget.toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.budget, initial.budget)}`}>
                            {getTrendText(indicators.budget, initial.budget)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Entreprises</div>
                        <div className="indicator-value" style={{color: '#6f42c1'}}>
                            {indicators.entreprises}/100
                        </div>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Salariés</div>
                        <div className="indicator-value" style={{color: '#fd7e14'}}>
                            {indicators.salaries}/100
                        </div>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Croissance</div>
                        <div className="indicator-value" style={{color: v('croissance', 1.5) > 1.5 ? '#28a745' : '#ffc107'}}>
                            {v('croissance', 1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('croissance', 1.5), initial.croissance)}`}>
                            {getTrendText(v('croissance', 1.5), initial.croissance)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Déficit Public</div>
                        <div className="indicator-value" style={{color: v('deficit', 3) < 3 ? '#28a745' : '#dc3545'}}>
                            {v('deficit', 3).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('deficit', 3), initial.deficit, true)}`}>
                            {getTrendText(v('deficit', 3), initial.deficit, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Dette Publique</div>
                        <div className="indicator-value" style={{color: v('dette', 85) < 90 ? '#28a745' : '#ffc107'}}>
                            {v('dette', 85).toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('dette', 85), initial.dette, true)}`}>
                            {getTrendText(v('dette', 85), initial.dette, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Inflation</div>
                        <div className="indicator-value" style={{color: v('inflation', 1.5) < 2.5 ? '#28a745' : '#dc3545'}}>
                            {v('inflation', 1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('inflation', 1.5), initial.inflation, true)}`}>
                            {getTrendText(v('inflation', 1.5), initial.inflation, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux de Pauvreté</div>
                        <div className="indicator-value" style={{color: v('pauvrete', 10) < 10 ? '#28a745' : '#dc3545'}}>
                            {v('pauvrete', 10).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('pauvrete', 10), initial.pauvrete, true)}`}>
                            {getTrendText(v('pauvrete', 10), initial.pauvrete, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Inégalités</div>
                        <div className="indicator-value" style={{color: v('inegalites', 30) < 30 ? '#28a745' : '#ffc107'}}>
                            {v('inegalites', 30).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('inegalites', 30), initial.inegalites, true)}`}>
                            {getTrendText(v('inegalites', 30), initial.inegalites, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Popularité</div>
                        <div className="indicator-value" style={{color: v('popularite', 50) > 50 ? '#28a745' : '#dc3545'}}>
                            {v('popularite', 50).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(v('popularite', 50), initial.popularite)}`}>
                            {getTrendText(v('popularite', 50), initial.popularite)}
                        </span>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Game />, document.getElementById('root'));
    </script>
</body>
</html>
