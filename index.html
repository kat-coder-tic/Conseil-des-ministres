                let newIndicators = {...gameState.indicators};

                // Apply policy impacts

                        if (newIndicators[key] !== undefined) {
                            newIndicators[key] = Math.max(0, Math.min(100, 
                                newIndicators[key] + policy.impacts[key]
                            ));
                        }
                    });
                });

                // Calculate quarterly budget renewal (tax revenues)
                // Base renewal: 25% + bonus based on economic performance
                const baseRenewal = 25;
                const growthBonus = Math.max(0, newIndicators.croissance || 1.5) * 2;
                const employmentBonus = (newIndicators.emploi - 65) * 0.5;
                const totalRenewal = baseRenewal + growthBonus + employmentBonus;
                
                // Add quarterly revenues (capped at 150%)
                newIndicators.budget = Math.min(150, newIndicators.budget + totalRenewal);

                // Store quarterly revenue for display
                const quarterlyRevenue = Math.round(totalRenewal);

                // Recalculate derived indicators
                newIndicators.activite = Math.min(100, newIndicators.emploi + newIndicators.chomage / 2);
                
                // Random event (scenario-dependent probability)
                const eventProbability = gameState.scenario?.eventProbability || 0.3;
                const shouldTriggerEvent = Math.random() < eventProbability && gameState.quarter < gameState.totalQuarters;
                
                // Filter events by scenario
                const scenarioEvents = EVENTS.filter(e => 
                    !e.scenarios || e.scenarios.includes(gameState.scenario?.id)
                );
                const randomEvent = shouldTriggerEvent && scenarioEvents.length > 0
                    ? scenarioEvents[Math.floor(Math.random() * scenarioEvents.length)]
                    : null;

                if (randomEvent) {
                    Object.keys(randomEvent.impacts).forEach(key => {
                        if (newIndicators[key] !== undefined) {
                            newIndicators[key] = Math.max(0, Math.min(100,
                                newIndicators[key] + randomEvent.impacts[key]
                            ));
                        }
                    });
                }

                const newHistory = [...gameState.history, {
                    quarter: gameState.quarter,
                    policies: selectedPoliciesData,
                    indicators: newIndicators,
                    event: randomEvent,
                    quarterlyRevenue: quarterlyRevenue
                }];

                // Check for midterm report (after quarter 4)
                const isMidterm = gameState.quarter === 4;

                if (randomEvent) {
                    setGameState(prev => ({
                        ...prev,
                        indicators: newIndicators,
                        history: newHistory,
                        eventTriggered: randomEvent,
                        quarterlyRevenue: quarterlyRevenue,
                        phase: 'event'
                    }));
                } else if (isMidterm) {
                    setGameState(prev => ({
                        ...prev,
                        indicators: newIndicators,
                        history: newHistory,
                        quarterlyRevenue: quarterlyRevenue,
                        phase: 'midterm'
                    }));
                } else if (gameState.quarter >= gameState.totalQuarters) {
                    setGameState(prev => ({
                        ...prev,
                        indicators: newIndicators,
                        history: newHistory,
                        phase: 'results',
                        completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id]
                    }));
                } else {
                    setGameState(prev => ({
                        ...prev,
                        quarter: prev.quarter + 1,
                        indicators: newIndicators,
                        history: newHistory,
                        selectedPolicies: [],
                        quarterlyRevenue: quarterlyRevenue,
                        phase: 'playing'
                    }));
                }

            const continueAfterEvent = () => {
                const lastHistory = gameState.history[gameState.history.length - 1];
                const quarterlyRevenue = lastHistory?.quarterlyRevenue || 0;
                const isMidterm = gameState.quarter === 4;

                    setGameState(prev => ({...prev, phase: 'midterm'}));
                } else if (gameState.quarter >= gameState.totalQuarters) {

                        phase: 'results',
                        completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id]

                const budgetScore = Math.max(0, 100 - Math.abs(100 - final.budget));
                const equilibreScore = Math.max(0, 100 - Math.abs(final.entreprises - final.salaries));

                    chomage: Math.round(chômageScore),
                    emploi: Math.round(emploiScore),

                                {isOnTrack ? '✅ Vous êtes sur la bonne voie !' : '⚠️ Effort supplémentaire nécessaire'}
                            </h2>
                            
                            <Dashboard indicators={current} />
                            
                            <div style={{
                                background: isOnTrack ? '#d4edda' : '#fff3cd',
                                padding: '30px',
                                borderRadius: '12px',
                                margin: '30px 0',
                                border: `3px solid ${isOnTrack ? '#28a745' : '#ffc107'}`
                            }}>
                                <h3 style={{marginBottom: '20px', fontSize: '1.5em'}}>
                                    📈 Évolution du chômage
                                </h3>
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(3, 1fr)',
                                    gap: '20px',
                                    textAlign: 'center'
                                }}>
                                    <div>
                                        <div style={{fontSize: '0.9em', color: '#666'}}>Départ</div>
                                        <div style={{fontSize: '2em', fontWeight: 'bold', color: '#dc3545'}}>
                                            {initial.chomage}%
                                        </div>
                                    </div>
                                    <div>
                                        <div style={{fontSize: '0.9em', color: '#666'}}>Actuellement</div>
                                        <div style={{fontSize: '2em', fontWeight: 'bold', color: '#2a5298'}}>
                                            {current.chomage.toFixed(1)}%
                                        </div>
                                    </div>
                                    <div>
                                        <div style={{fontSize: '0.9em', color: '#666'}}>Objectif final</div>
                                        <div style={{fontSize: '2em', fontWeight: 'bold', color: '#28a745'}}>
                                            {'<'} {target}%
                                        </div>
                                    </div>
                                </div>
                                
                                <div style={{marginTop: '20px'}}>
                                    <div style={{fontSize: '0.9em', marginBottom: '5px'}}>
                                        Progression vers l'objectif : {Math.min(100, Math.max(0, progressChomage)).toFixed(0)}%
                                    </div>
                                    <div className="progress-bar">
                                        <div 
                                            className="progress-fill" 
                                            style={{width: `${Math.min(100, Math.max(0, progressChomage))}%`}}
                                        >
                                            {Math.min(100, Math.max(0, progressChomage)).toFixed(0)}%
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="results-grid">
                                <div className="result-card">
                                    <h4>💼 Taux d'emploi</h4>
                                    <div className="result-score" style={{color: current.emploi > initial.emploi ? '#28a745' : '#dc3545'}}>
                                        {current.emploi.toFixed(1)}%
                                    </div>
                                    <p>Évolution : {(current.emploi - initial.emploi > 0 ? '+' : '')}{(current.emploi - initial.emploi).toFixed(1)}</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>💰 Budget</h4>
                                    <div className="result-score" style={{color: current.budget > 50 ? '#28a745' : '#dc3545'}}>
                                        {current.budget.toFixed(0)}%
                                    </div>
                                    <p>{current.budget > initial.budget ? 'Excédent' : 'Déficit'}</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>📊 Croissance</h4>
                                    <div className="result-score" style={{color: current.croissance > 1.5 ? '#28a745' : '#ffc107'}}>
                                        {current.croissance?.toFixed(1) || '1.5'}%
                                    </div>
                                    <p>Dynamique économique</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>⚖️ Équilibre social</h4>
                                    <div className="result-score" style={{color: Math.abs(current.entreprises - current.salaries) < 20 ? '#28a745' : '#ffc107'}}>
                                        {Math.abs(current.entreprises - current.salaries).toFixed(0)}
                                    </div>
                                    <p>Écart satisfaction</p>
                                </div>
                            </div>
                            
                            <div style={{
                                background: '#f8f9fa',
                                padding: '30px',
                                borderRadius: '12px',
                                marginTop: '30px'
                            }}>
                                <h3 style={{color: '#2a5298', marginBottom: '20px'}}>💡 Recommandations pour les 4 prochains trimestres</h3>
                                <ul style={{textAlign: 'left', lineHeight: '2', fontSize: '1.05em'}}>
                                    {current.chomage > initial.chomage * 0.8 && (
                                        <li>Le chômage reste élevé : privilégiez les politiques <strong>actives</strong> (formation, aides à l'embauche)</li>
                                    )}
                                    {current.budget < 60 && (
                                        <li>Budget tendu : favorisez la croissance pour augmenter les <strong>recettes fiscales</strong></li>
                                    )}
                                    {Math.abs(current.entreprises - current.salaries) > 25 && (
                                        <li>Déséquilibre social : rééquilibrez vos mesures entre <strong>entreprises et salariés</strong></li>
                                    )}
                                    {current.croissance < 1 && (
                                        <li>Croissance faible : investissez dans des <strong>politiques de demande</strong> (investissement public)</li>
                                    )}
                                    {isOnTrack && (
                                        <li>Bon rythme ! Maintenez votre stratégie et anticipez les <strong>événements aléatoires</strong></li>
                                    )}
                                </ul>
                            </div>
                            
                            <div className="action-buttons" style={{marginTop: '30px'}}>
                                <button className="btn btn-primary" onClick={continueFromMidterm}>
                                    Continuer la seconde année 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState.phase === 'diagnostic') {
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>📊 Phase de Diagnostic</h1>
                            <p>Analysez la situation avant d'agir</p>
                        </div>
                        
                        <Dashboard indicators={gameState.indicators} />
                        
                        <div className="diagnostic-screen">
                            <div className="diagnostic-content">
                                <div className="diagnostic-section">
                                    <h3>🔍 Analyse de la situation</h3>
                                    <ul className="diagnostic-list">
                                        <li><strong>Taux de chômage élevé (12%)</strong> : Supérieur à la moyenne européenne</li>
                                        <li><strong>Chômage structurel</strong> : Inadéquation compétences / besoins du marché</li>
                                        <li><strong>Chômage conjoncturel</strong> : Ralentissement économique récent</li>
                                        <li><strong>Chômage frictionnel</strong> : Délais de transition entre emplois</li>
                                    </ul>
                                </div>
                                
                                <div className="diagnostic-section">
                                    <h3>💡 Causes identifiées</h3>
                                    <ul className="diagnostic-list">
                                        <li>Manque de formation adaptée aux besoins des entreprises</li>
                                        <li>Coût du travail élevé pour les employeurs</li>
                                        <li>Faible demande de biens et services (croissance faible)</li>
                                        <li>Transformations technologiques (automatisation)</li>
                                    </ul>
                                </div>
                                
                                <div className="diagnostic-section">
                                    <h3>🎯 Votre stratégie</h3>
                                    <p style={{lineHeight: '1.8'}}>
                                        À chaque trimestre, vous pourrez choisir <strong>jusqu'à 3 mesures</strong> 
                                        parmi les politiques actives, passives, de demande ou d'offre.
                                        Chaque mesure a un coût et des impacts sur différents indicateurs.
                                    </p>
                                </div>
                                
                                <div className="diagnostic-section">
                                    <h3>💰 Budget de l'État</h3>
                                    <p style={{lineHeight: '1.8'}}>
                                        <strong>Bonne nouvelle !</strong> Votre budget se renouvelle chaque trimestre grâce aux 
                                        <strong> recettes fiscales</strong> (impôts, taxes, cotisations sociales).
                                    </p>
                                    <ul className="diagnostic-list">
                                        <li><strong>Recettes de base</strong> : environ +25% par trimestre</li>
                                        <li><strong>Bonus croissance</strong> : plus de croissance = plus de recettes</li>
                                        <li><strong>Bonus emploi</strong> : plus d'emplois = plus de cotisations</li>
                                        <li><strong>Maximum</strong> : le budget est plafonné à 150%</li>
                                    </ul>
                                    <p style={{lineHeight: '1.8', marginTop: '15px', color: '#666'}}>
                                        💡 <em>Investir dans la croissance et l'emploi augmente vos recettes futures !</em>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={startPlaying}>
                                    Passer à l'action ! 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState.phase === 'event' && gameState.eventTriggered) {
                return (
                    <div className="event-modal">
                        <div className="event-content">
                            <div className="event-icon">{gameState.eventTriggered.icon}</div>
                            <h2 className="event-title">Événement : {gameState.eventTriggered.name}</h2>
                            <p className="event-description">{gameState.eventTriggered.description}</p>
                            
                            <div style={{background: '#f8f9fa', padding: '20px', borderRadius: '12px', marginBottom: '20px'}}>
                                <h4>Impacts :</h4>
                                <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px', justifyContent: 'center', marginTop: '15px'}}>
                                    {Object.entries(gameState.eventTriggered.impacts).map(([key, value]) => (
                                        <span key={key} className={`impact-badge ${value > 0 ? 'impact-negative' : 'impact-positive'}`}>
                                            {key}: {value > 0 ? '+' : ''}{value}
                                        </span>
                                    ))}
                                </div>
                            </div>
                            
                            <button className="btn btn-primary" onClick={continueAfterEvent}>
                                Continuer
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState.phase === 'results') {
                const scores = calculateScore();
                const targetAchieved = gameState.indicators.chomage < (gameState.scenario?.targetChomage || 8);
                
                return (
                    <div className="game-container">
                        <div className="game-header" style={{background: targetAchieved ? 'linear-gradient(135deg, #28a745 0%, #20c997 100%)' : 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)'}}>
                            <h1>{targetAchieved ? '🏆 Mission Réussie !' : '📊 Fin du Mandat'}</h1>
                            <p>{gameState.scenario?.name} - Votre bilan après 2 ans</p>
                        </div>
                        
                        <Dashboard indicators={gameState.indicators} />
                        
                        <div className="results-screen">
                            <div style={{
                                padding: '30px',
                                borderRadius: '12px',
                                marginBottom: '30px',
                                background: targetAchieved ? '#d4edda' : '#f8d7da',
                                border: `3px solid ${targetAchieved ? '#28a745' : '#dc3545'}`
                            }}>
                                <h2 style={{fontSize: '2em', marginBottom: '15px'}}>
                                    {targetAchieved ? '✅ Objectif Atteint !' : '❌ Objectif Non Atteint'}
                                </h2>
                                <p style={{fontSize: '1.2em'}}>
                                    <strong>Objectif :</strong> Chômage {'<'} {gameState.scenario?.targetChomage || 8}%
                                    <br/>
                                    <strong>Résultat :</strong> {gameState.indicators.chomage.toFixed(1)}%
                                </p>
                            </div>
                            
                            <h2 className="results-title">Score Global : {scores.total}/100</h2>
                            <h3 style={{color: '#666', marginBottom: '30px'}}>{getScoreText(scores.total)}</h3>
                            
                            <div className="results-grid">
                                <div className="result-card">
                                    <h4>Lutte contre le chômage</h4>
                                    <div className={`result-score ${getScoreClass(scores.chomage)}`}>
                                        {scores.chomage}/100
                                    </div>
                                    <p>Évolution : {gameState.scenario?.initialState.chomage}% → {gameState.indicators.chomage.toFixed(1)}%</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>Création d'emplois</h4>
                                    <div className={`result-score ${getScoreClass(scores.emploi)}`}>
                                        {scores.emploi}/100
                                    </div>
                                    <p>Évolution : {gameState.scenario?.initialState.emploi}% → {gameState.indicators.emploi.toFixed(1)}%</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>Gestion budgétaire</h4>
                                    <div className={`result-score ${getScoreClass(scores.budget)}`}>
                                        {scores.budget}/100
                                    </div>
                                    <p>Budget restant : {gameState.indicators.budget.toFixed(0)}%</p>
                                </div>
                                
                                <div className="result-card">
                                    <h4>Équilibre social</h4>
                                    <div className={`result-score ${getScoreClass(scores.equilibre)}`}>
                                        {scores.equilibre}/100
                                    </div>
                                    <p>Entreprises : {gameState.indicators.entreprises} | Salariés : {gameState.indicators.salaries}</p>
                                </div>
                            </div>
                            
                            <div style={{background: '#f8f9fa', padding: '30px', borderRadius: '12px', marginTop: '30px'}}>
                                <h3 style={{color: '#2a5298', marginBottom: '20px'}}>📚 Points pédagogiques</h3>
                                <ul style={{textAlign: 'left', lineHeight: '2', fontSize: '1.05em'}}>
                                    <li><strong>Politiques actives vs passives</strong> : Les politiques actives (formation, aides à l'embauche) sont plus efficaces à long terme</li>
                                    <li><strong>Demande vs offre</strong> : Les politiques de demande stimulent la croissance, celles d'offre réduisent les coûts</li>
                                    <li><strong>Arbitrages</strong> : Chaque décision implique des compromis (coût/efficacité, court/long terme)</li>
                                    <li><strong>Chômage structurel</strong> : Nécessite des réformes profondes (formation, innovation)</li>
                                    <li><strong>Budget renouvelable</strong> : Plus de croissance et d'emploi = plus de recettes fiscales</li>
                                    <li><strong>Équilibre social</strong> : Maintenir la satisfaction des différentes parties prenantes</li>
                                </ul>
                            </div>
                            
                            {gameState.completedScenarios && gameState.completedScenarios.length < 4 && (
                                <div style={{
                                    background: '#cfe2ff',
                                    padding: '30px',
                                    borderRadius: '12px',
                                    marginTop: '30px',
                                    border: '2px solid #0d6efd'
                                }}>
                                    <h3 style={{color: '#0d6efd', marginBottom: '15px'}}>
                                        🎯 Défi suivant !
                                    </h3>
                                    <p style={{fontSize: '1.1em', marginBottom: '20px'}}>
                                        Vous avez terminé {gameState.completedScenarios.length} scénario(s) sur 4.
                                        Relevez d'autres défis pour maîtriser toutes les situations économiques !
                                    </p>
                                    <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                        {Object.keys(SCENARIOS).filter(id => !gameState.completedScenarios.includes(id)).map(id => (
                                            <span key={id} style={{
                                                padding: '8px 15px',
                                                borderRadius: '20px',
                                                background: 'white',
                                                fontSize: '0.9em'
                                            }}>
                                                {SCENARIOS[id].name}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {gameState.completedScenarios && gameState.completedScenarios.length === 4 && (
                                <div style={{
                                    background: 'linear-gradient(135deg, #ffd700 0%, #ffed4e 100%)',
                                    padding: '40px',
                                    borderRadius: '12px',
                                    marginTop: '30px',
                                    border: '3px solid #ffd700',
                                    textAlign: 'center'
                                }}>
                                    <h2 style={{fontSize: '2.5em', marginBottom: '20px'}}>
                                        🏆 FÉLICITATIONS ! 🏆
                                    </h2>
                                    <p style={{fontSize: '1.3em', fontWeight: 'bold', marginBottom: '15px'}}>
                                        Vous avez terminé tous les scénarios !
                                    </p>
                                    <p style={{fontSize: '1.1em'}}>
                                        Vous maîtrisez maintenant toutes les facettes des politiques de l'emploi !
                                    </p>
                                </div>
                            )}
                            
                            <div className="action-buttons" style={{marginTop: '30px'}}>
                                <button className="btn btn-primary" onClick={backToScenarios}>
                                    Choisir un autre scénario
                                </button>
                                <button className="btn btn-secondary" onClick={resetGame}>
                                    Recommencer ce scénario
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing phase
            return (
                <div className="game-container">
                    <div className="game-header">
                        <h1>🏛️ Ministre du Travail : La Crise de l'Emploi</h1>
                        <p>Prenez vos décisions pour améliorer l'emploi</p>
                    </div>
                    
                    <div className="quarter-indicator">
                        📅 Trimestre {gameState.quarter} / {gameState.totalQuarters || 8}
                        {gameState.quarter <= 4 && <span style={{marginLeft: '20px', opacity: 0.8}}>Première année</span>}
                        {gameState.quarter > 4 && <span style={{marginLeft: '20px', opacity: 0.8}}>Seconde année</span>}
                    </div>
                    
                    {gameState.quarterlyRevenue && (
                        <div style={{
                            margin: '0 30px 20px 30px',
                            padding: '15px 20px',
                            background: 'linear-gradient(135deg, #28a745 0%, #20c997 100%)',
                            color: 'white',
                            borderRadius: '12px',
                            textAlign: 'center',
                            fontWeight: 'bold',
                            fontSize: '1.1em',
                            boxShadow: '0 4px 12px rgba(40, 167, 69, 0.3)',
                            animation: 'slideIn 0.5s ease-out'
                        }}>
                            💰 Recettes fiscales du trimestre : +{gameState.quarterlyRevenue}% de budget
                            <div style={{fontSize: '0.85em', marginTop: '5px', opacity: 0.9}}>
                                (Impôts, cotisations sociales, taxes...)
                            </div>
                        </div>
                    )}
                    
                    <Dashboard indicators={gameState.indicators} />
                    
                    <div className="game-phase">
                        <h2 className="phase-title">
                            Choisissez jusqu'à 3 mesures ({gameState.selectedPolicies.length}/3 sélectionnées)
                        </h2>
                        
                        <div className="policies-grid">
                            {POLICIES.map(policy => {
                                const isSelected = gameState.selectedPolicies.includes(policy.id);
                                const isDisabled = !isSelected && gameState.selectedPolicies.length >= 3;
                                const canAfford = gameState.indicators.budget >= policy.cost;
                                
                                return (
                                    <div
                                        key={policy.id}
                                        className={`policy-card ${isSelected ? 'selected' : ''} ${(isDisabled || !canAfford) ? 'disabled' : ''}`}
                                        onClick={() => canAfford && !isDisabled ? togglePolicy(policy.id) : null}
                                    >
                                        <span className={`policy-type type-${policy.type}`}>
                                            {policy.type}
                                        </span>
                                        <span className="policy-cost">💰 {policy.cost}%</span>
                                        <div className="policy-name">{policy.name}</div>
                                        <div className="policy-description">{policy.description}</div>
                                        <div className="policy-impacts">
                                            {Object.entries(policy.impacts).map(([key, value]) => (
                                                <span 
                                                    key={key} 
                                                    className={`impact-badge ${value > 0 ? 'impact-positive' : 'impact-negative'}`}
                                                >
                                                    {key} {value > 0 ? '+' : ''}{value}
                                                </span>
                                            ))}
                                        </div>
                                        {!canAfford && <div style={{color: '#dc3545', marginTop: '10px', fontWeight: 'bold'}}>Budget insuffisant</div>}
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div className="action-buttons">
                            <button 
                                className="btn btn-primary" 
                                onClick={executeQuarter}
                                disabled={gameState.selectedPolicies.length === 0}
                            >
                                Valider et passer au trimestre suivant
                            </button>
                            <button className="btn btn-secondary" onClick={resetGame}>
                                Recommencer
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ indicators }) {
            const getTrend = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return 'stable';
                return inverse ? (diff > 0 ? 'down' : 'up') : (diff > 0 ? 'up' : 'down');
            };

            const getTrendText = (current, initial, inverse = false) => {
                const diff = current - initial;
                if (Math.abs(diff) < 0.5) return '→';
                const symbol = inverse ? (diff > 0 ? '↓' : '↑') : (diff > 0 ? '↑' : '↓');
                return `${symbol} ${Math.abs(diff).toFixed(1)}`;
            };

            const initial = INITIAL_STATE.indicators;

            return (
                <div className="dashboard">
                    <div className="indicator">
                        <div className="indicator-label">Taux de chômage</div>
                        <div className="indicator-value" style={{color: indicators.chomage > 10 ? '#dc3545' : '#28a745'}}>
                            {indicators.chomage.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.chomage, initial.chomage, true)}`}>
                            {getTrendText(indicators.chomage, initial.chomage, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux d'emploi</div>
                        <div className="indicator-value" style={{color: indicators.emploi > 70 ? '#28a745' : '#ffc107'}}>
                            {indicators.emploi.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.emploi, initial.emploi)}`}>
                            {getTrendText(indicators.emploi, initial.emploi)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux d'activité</div>
                        <div className="indicator-value" style={{color: '#17a2b8'}}>
                            {indicators.activite.toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.activite, initial.activite)}`}>
                            {getTrendText(indicators.activite, initial.activite)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Budget de l'État</div>
                        <div className="indicator-value" style={{color: indicators.budget > 50 ? '#28a745' : '#dc3545'}}>
                            {indicators.budget.toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.budget, initial.budget)}`}>
                            {getTrendText(indicators.budget, initial.budget)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Entreprises</div>
                        <div className="indicator-value" style={{color: '#6f42c1'}}>
                            {indicators.entreprises}/100
                        </div>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Satisfaction Salariés</div>
                        <div className="indicator-value" style={{color: '#fd7e14'}}>
                            {indicators.salaries}/100
                        </div>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Croissance</div>
                        <div className="indicator-value" style={{color: (indicators.croissance || 1.5) > 1.5 ? '#28a745' : '#ffc107'}}>
                            {(indicators.croissance || 1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.croissance || 1.5, initial.croissance || 1.5)}`}>
                            {getTrendText(indicators.croissance || 1.5, initial.croissance || 1.5)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Déficit Public</div>
                        <div className="indicator-value" style={{color: (indicators.deficit || 3) < 3 ? '#28a745' : '#dc3545'}}>
                            {(indicators.deficit || 3).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.deficit || 3, initial.deficit || 3, true)}`}>
                            {getTrendText(indicators.deficit || 3, initial.deficit || 3, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Dette Publique</div>
                        <div className="indicator-value" style={{color: (indicators.dette || 85) < 90 ? '#28a745' : '#ffc107'}}>
                            {(indicators.dette || 85).toFixed(0)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.dette || 85, initial.dette || 85, true)}`}>
                            {getTrendText(indicators.dette || 85, initial.dette || 85, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Inflation</div>
                        <div className="indicator-value" style={{color: (indicators.inflation || 1.5) < 2.5 ? '#28a745' : '#dc3545'}}>
                            {(indicators.inflation || 1.5).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.inflation || 1.5, initial.inflation || 1.5, true)}`}>
                            {getTrendText(indicators.inflation || 1.5, initial.inflation || 1.5, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Taux de Pauvreté</div>
                        <div className="indicator-value" style={{color: (indicators.pauvrete || 10) < 10 ? '#28a745' : '#dc3545'}}>
                            {(indicators.pauvrete || 10).toFixed(1)}%
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.pauvrete || 10, initial.pauvrete || 10, true)}`}>
                            {getTrendText(indicators.pauvrete || 10, initial.pauvrete || 10, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Inégalités</div>
                        <div className="indicator-value" style={{color: (indicators.inegalites || 30) < 30 ? '#28a745' : '#ffc107'}}>
                            {(indicators.inegalites || 30).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.inegalites || 30, initial.inegalites || 30, true)}`}>
                            {getTrendText(indicators.inegalites || 30, initial.inegalites || 30, true)}
                        </span>
                    </div>

                    <div className="indicator">
                        <div className="indicator-label">Popularité</div>
                        <div className="indicator-value" style={{color: (indicators.popularite || 50) > 50 ? '#28a745' : '#dc3545'}}>
                            {(indicators.popularite || 50).toFixed(0)}/100
                        </div>
                        <span className={`indicator-trend trend-${getTrend(indicators.popularite || 50, initial.popularite || 50)}`}>
                            {getTrendText(indicators.popularite || 50, initial.popularite || 50)}
                        </span>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Game />, document.getElementById('root'));
    </script>
</body>
</html>
