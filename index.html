<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conseil des Ministres - Jeu pédagogique</title>
    <meta property="og:title" content="Conseil des Ministres - Jeu pédagogique">
    <meta property="og:url" content="https://kat-coder-tic.github.io/Conseil-des-ministres/">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .game-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .indicator {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .indicator:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .indicator-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .indicator-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .indicator-trend {
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .trend-up {
            background: #d4edda;
            color: #155724;
        }

        .trend-down {
            background: #f8d7da;
            color: #721c24;
        }

        .trend-stable {
            background: #fff3cd;
            color: #856404;
        }

        .game-phase {
            padding: 30px;
        }

        .phase-title {
            font-size: 1.8em;
            color: #2a5298;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        /* ── Barre de filtres ── */
        .filters-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            padding: 14px 18px;
            background: #f0f2ff;
            border-radius: 12px;
            border: 1.5px solid #d0d8ff;
        }
        .filters-bar .filter-label {
            font-size: 0.8em;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-btn {
            padding: 5px 13px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 0.78em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            background: white;
            color: #555;
            border-color: #ddd;
        }
        .filter-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
        .filter-btn.active { color: white; border-color: transparent; }
        .filter-btn.fb-all.active         { background: #2a5298; }
        .filter-btn.fb-active.active      { background: #28a745; }
        .filter-btn.fb-passive.active     { background: #6c757d; }
        .filter-btn.fb-demande.active     { background: #007bff; }
        .filter-btn.fb-offre.active       { background: #e6a800; color:#333; }
        .filter-btn.fb-economie.active    { background: #17a2b8; }
        .filter-btn.fb-social.active      { background: #dc3545; }
        .filter-btn.fb-education.active   { background: #fd7e14; }
        .filter-btn.fb-affordable.active  { background: #20c997; }
        .filter-btn.fb-selected.active    { background: #6f42c1; }

        .sort-select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 0.8em;
            font-weight: 600;
            color: #333;
            background: white;
            cursor: pointer;
        }
        .sort-select:focus { outline: none; border-color: #667eea; }

        .filters-count {
            margin-left: auto;
            font-size: 0.8em;
            color: #888;
            white-space: nowrap;
        }

        .policy-card.hidden { display: none; }

        .policies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .policy-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .policy-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .policy-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .policy-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .policy-type {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-active {
            background: #28a745;
            color: white;
        }

        .type-passive {
            background: #6c757d;
            color: white;
        }

        .type-demande {
            background: #007bff;
            color: white;
        }

        .type-offre {
            background: #ffc107;
            color: #333;
        }

        .type-economie {
            background: #17a2b8;
            color: white;
        }

        .type-social {
            background: #dc3545;
            color: white;
        }

        .type-education {
            background: #fd7e14;
            color: white;
        }

        .policy-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .policy-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .policy-impacts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .impact-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .impact-positive {
            background: #d4edda;
            color: #155724;
        }

        .impact-negative {
            background: #f8d7da;
            color: #721c24;
        }

        .policy-cost {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #2a5298;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .event-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .event-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .event-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .event-title {
            font-size: 1.8em;
            color: #2a5298;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .event-description {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .results-screen {
            padding: 40px;
            text-align: center;
        }

        .results-title {
            font-size: 2.5em;
            color: #2a5298;
            margin-bottom: 30px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .result-score {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-excellent {
            color: #28a745;
        }

        .score-good {
            color: #17a2b8;
        }

        .score-average {
            color: #ffc107;
        }

        .score-poor {
            color: #dc3545;
        }

        .diagnostic-screen {
            padding: 30px;
        }

        .diagnostic-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .diagnostic-section {
            margin-bottom: 30px;
        }

        .diagnostic-section h3 {
            color: #2a5298;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .diagnostic-list {
            list-style: none;
            padding: 0;
        }

        .diagnostic-list li {
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .quarter-indicator {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #2a5298 0%, #667eea 100%);
            color: white;
            margin: 20px 30px;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
        }

        /* ── Panneau objectifs ── */
        .objectives-panel {
            margin: 0 30px 10px 30px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border-radius: 12px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .objectives-panel .obj-title {
            font-weight: 700;
            font-size: 1em;
            opacity: 0.85;
            white-space: nowrap;
        }
        .obj-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.9em;
        }
        .obj-item.achieved {
            background: rgba(40,167,69,0.5);
            border: 1.5px solid #28a745;
        }
        .obj-item.danger {
            background: rgba(220,53,69,0.4);
            border: 1.5px solid #dc3545;
        }

        /* ── Layout principal jeu ── */
        .playing-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 0;
        }
        .playing-main { min-width: 0; }
        .playing-sidebar {
            border-left: 2px solid #e0e0e0;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
        }

        /* ── Journal des actions ── */
        .journal-panel {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 700px;
        }
        .journal-panel h3 {
            color: #2a5298;
            font-size: 1em;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .journal-entry {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
            font-size: 0.82em;
        }
        .journal-entry.has-event {
            border-left-color: #dc3545;
        }
        .journal-quarter-label {
            font-weight: 700;
            color: #2a5298;
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        .journal-policy-tag {
            display: inline-block;
            background: #e8ecff;
            color: #2a5298;
            border-radius: 4px;
            padding: 2px 7px;
            margin: 2px 2px 2px 0;
            font-size: 0.85em;
        }
        .journal-event-tag {
            display: inline-block;
            background: #fde8e8;
            color: #c0392b;
            border-radius: 4px;
            padding: 2px 7px;
            margin-top: 4px;
            font-size: 0.85em;
        }
        .journal-indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 8px;
            margin-top: 6px;
            color: #555;
        }
        .journal-ind-item { font-size: 0.82em; }
        .ind-up { color: #28a745; }
        .ind-down { color: #dc3545; }

        /* ── Mini graphique SVG ── */
        .chart-panel {
            padding: 16px 20px;
            border-top: 2px solid #e0e0e0;
        }
        .chart-panel h3 {
            color: #2a5298;
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        .chart-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .chart-tab {
            padding: 3px 10px;
            border-radius: 12px;
            border: none;
            font-size: 0.75em;
            cursor: pointer;
            background: #e0e0e0;
            color: #555;
            font-weight: 600;
        }
        .chart-tab.active {
            background: #2a5298;
            color: white;
        }

        @media (max-width: 900px) {
            .playing-layout { grid-template-columns: 1fr; }
            .playing-sidebar { border-left: none; border-top: 2px solid #e0e0e0; }
            .journal-panel { max-height: 300px; }
        }

        @media (max-width: 768px) {
            .game-header h1 { font-size: 1.8em; }
            .dashboard { grid-template-columns: repeat(2, 1fr); padding: 15px; gap: 10px; }
            .policies-grid { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .ministers-bar { flex-wrap: nowrap; }
            .minister-tab { padding: 10px 12px; font-size: 0.8em; }
            .glossary-btn { bottom: 15px; right: 15px; padding: 10px 16px; font-size: 0.85em; }
        }

        /* ══════════════════════════════════
           FLASH QUIZ MODAL
        ══════════════════════════════════ */
        .quiz-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            animation: fadeInOverlay 0.3s ease;
        }
        @keyframes fadeInOverlay { from { opacity:0 } to { opacity:1 } }

        .quiz-modal {
            background: white;
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 560px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUpModal 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes slideUpModal {
            from { transform: translateY(60px); opacity:0; }
            to   { transform: translateY(0);    opacity:1; }
        }
        .quiz-source {
            display: inline-flex; align-items: center; gap: 6px;
            background: #e8f0fe; color: #2a5298;
            border-radius: 20px; padding: 5px 14px;
            font-size: 0.82em; font-weight: 700;
            margin-bottom: 16px;
        }
        .quiz-question {
            font-size: 1.15em; font-weight: 700;
            color: #1a1a2e; line-height: 1.5;
            margin-bottom: 22px;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
        .quiz-option {
            border: 2px solid #e0e0e0; border-radius: 10px;
            padding: 13px 18px; text-align: left;
            font-size: 0.97em; cursor: pointer; background: white;
            transition: all 0.18s; font-family: inherit;
            display: flex; align-items: center; gap: 10px;
        }
        .quiz-option:hover:not(:disabled) { border-color: #667eea; background: #f0f2ff; transform: translateX(3px); }
        .quiz-option.correct  { border-color: #28a745; background: #d4edda; color: #155724; font-weight: 700; }
        .quiz-option.wrong    { border-color: #dc3545; background: #f8d7da; color: #721c24; }
        .quiz-option.revealed { border-color: #28a745; background: #d4edda; color: #155724; font-weight: 700; opacity: 0.75; }
        .quiz-option:disabled { cursor: default; }
        .quiz-option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%;
            background: #f0f2ff; color: #2a5298; font-weight: 800; font-size: 0.85em;
            flex-shrink: 0;
        }
        .quiz-option.correct  .quiz-option-letter { background: #28a745; color: white; }
        .quiz-option.wrong    .quiz-option-letter { background: #dc3545; color: white; }
        .quiz-option.revealed .quiz-option-letter { background: #28a745; color: white; }
        .quiz-feedback {
            border-radius: 10px; padding: 14px 18px;
            font-size: 0.95em; line-height: 1.55;
            margin-bottom: 18px; display: flex; gap: 12px;
        }
        .quiz-feedback.good { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .quiz-feedback.bad  { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .quiz-bonus {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white; border-radius: 20px; padding: 4px 14px;
            font-size: 0.85em; font-weight: 700; margin-left: 8px;
        }
        .quiz-skip {
            background: none; border: none; color: #aaa; font-size: 0.85em;
            cursor: pointer; text-decoration: underline; margin-top: 4px;
        }
        .quiz-skip:hover { color: #666; }
        .quiz-continue {
            width: 100%;
            background: linear-gradient(135deg, #2a5298 0%, #667eea 100%);
            color: white; border: none; border-radius: 12px;
            padding: 14px; font-size: 1em; font-weight: 700;
            cursor: pointer; transition: transform 0.15s;
        }
        .quiz-continue:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(42,82,152,0.35); }

        /* ══════════════════════════════════
           CODE DE PARTIE (résultats)
        ══════════════════════════════════ */
        .score-code-box {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px; padding: 28px 32px;
            margin: 30px 0; text-align: center; color: white;
        }
        .score-code-title { font-size: 0.85em; opacity: 0.7; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }
        .score-code-value {
            font-size: 2.4em; font-weight: 900; letter-spacing: 6px;
            color: #ffd700; font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }
        .score-code-sub { font-size: 0.82em; opacity: 0.6; margin-bottom: 18px; }
        .score-code-copy {
            background: #ffd700; color: #1a1a2e;
            border: none; border-radius: 8px; padding: 9px 22px;
            font-size: 0.9em; font-weight: 800; cursor: pointer; transition: all 0.15s;
        }
        .score-code-copy:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .score-code-copied { background: #28a745; color: white; }
        .score-code-how {
            font-size: 0.82em; opacity: 0.55; margin-top: 12px;
            line-height: 1.5;
        }

        /* ══════════════════════════════════
           DASHBOARD COLLAPSE (priorité 3)
        ══════════════════════════════════ */
        .dashboard-toggle-bar {
            background: #f8f9fa; border-top: 2px solid #e0e0e0;

        const INITIAL_STATE = {
            quarter: 0,
            totalQuarters: 8,
            phase: 'scenario', // scenario, start, diagnostic, playing, event, midterm, results
            scenario: null,
            indicators: {
                // Emploi (existant)
                chomage: 12,
                emploi: 65,
                activite: 74,
                // Budget & Économie (Thème 6.3)
                budget: 100,

                // Acteurs
                entreprises: 50,
                salaries: 50,
                popularite: 50
            },
            selectedPolicies: [],
            history: [],
            eventTriggered: null,
            completedScenarios: []
        };

        function Game() {
            const [gameState, setGameState] = useState(() => {
                const saved = localStorage.getItem('ministre-travail-game');
                return saved ? JSON.parse(saved) : INITIAL_STATE;
            });

            const [showGlossary, setShowGlossary] = React.useState(false);
            const [quizState, setQuizState] = React.useState(null); // {question, pendingFn, answered, selected}
            const [quizStreak, setQuizStreak] = React.useState(0);
            const [quizCorrectTotal, setQuizCorrectTotal] = React.useState(0);
            const [dashExpanded, setDashExpanded] = React.useState(false);
            const [codeCopied, setCodeCopied] = React.useState(false);
            const [codeCopiedHeader, setCodeCopiedHeader] = React.useState(false);

            useEffect(() => {
                localStorage.setItem('ministre-travail-game', JSON.stringify(gameState));
            }, [gameState]);

            /* ── Helpers quiz ── */
            const pickQuizQuestion = (policies, event) => {
                // Cherche d'abord une question liée à l'événement
                if (event) {
                    const evQ = QUIZ_BANK.filter(q => q.eventIds && q.eventIds.includes(event.id));
                    if (evQ.length) return evQ[Math.floor(Math.random() * evQ.length)];
                }
                // Sinon cherche une question liée aux politiques jouées
                const types = policies.map(p => p.type);
                const candidates = QUIZ_BANK.filter(q => q.policyTypes && q.policyTypes.some(t => types.includes(t)));
                if (candidates.length) return candidates[Math.floor(Math.random() * candidates.length)];
                // Fallback aléatoire
                return QUIZ_BANK[Math.floor(Math.random() * QUIZ_BANK.length)];
            };

            const showQuizBefore = (nextFn, policies, event) => {
                // 70% de chance d'afficher un quiz (évite la lassitude)
                if (Math.random() > 0.70) { nextFn(); return; }
                const q = pickQuizQuestion(policies, event);
                setQuizState({ question: q, pendingFn: nextFn, answered: false, selected: null, bonusApplied: false });
            };

            const answerQuiz = (idx) => {
                if (!quizState || quizState.answered) return;
                const isCorrect = idx === quizState.question.correct;
                setQuizState(prev => ({ ...prev, answered: true, selected: idx }));
                if (isCorrect) {
                    setQuizStreak(s => s + 1);
                    setQuizCorrectTotal(c => c + 1);
                    // Applique le bonus indicateur
                    const bk = quizState.question.bonusKey;
                    const bv = quizState.question.bonusValue;
                    if (bk && bv) {
                        setGameState(prev => ({
                            ...prev,
                            indicators: { ...prev.indicators, [bk]: Math.min(100, (prev.indicators[bk] || 50) + bv) }
                        }));
                    }
                } else {
                    setQuizStreak(0);
                }
            };

            const closeQuiz = () => {
                const fn = quizState?.pendingFn;
                setQuizState(null);
                if (fn) fn();
            };

            /* ── Générateur de code de partie ── */
            const generateScoreCode = () => {
                const s = gameState;
                const ind = s.indicators;
                const sc = calculateScore();
                // Encode scénario + score + chômage final en base36
                const scenarioIdx = Object.keys(SCENARIOS).indexOf(s.scenario?.id || 'normale');
                // Encoding: idx*100000 + score*1000 + round(chomage*10)
                // Max val = 5*100000 + 99*1000 + 150 = 599150 < 36^4 = 1679615 (fits in 4 chars)
                const scoreVal = Math.min(Math.round(sc.total), 99);
                const chomageVal = Math.round(ind.chomage * 10);
                const val = (scenarioIdx * 100000) + (scoreVal * 1000) + chomageVal;
                const raw = val.toString(36).toUpperCase().padStart(4, '0');
                const checkChar = String.fromCharCode(65 + (val % 26));
                return raw + checkChar;
            };

            const selectScenario = (scenarioId) => {
                const scenario = SCENARIOS[scenarioId];
                setGameState({
                    ...INITIAL_STATE,
                    scenario: scenario,
                    indicators: {...scenario.initialState},
                    phase: 'start',
                    totalQuarters: 8
                });
            };

            const startGame = () => {
                setGameState(prev => ({...prev, phase: 'diagnostic'}));
            };

            const startPlaying = () => {
                setGameState(prev => ({
                    ...prev,
                    quarter: 1,
                    phase: 'playing'
                }));
            };

            const togglePolicy = (policyId) => {
                setGameState(prev => {
                    const selected = prev.selectedPolicies.includes(policyId)
                        ? prev.selectedPolicies.filter(id => id !== policyId)
                        : prev.selectedPolicies.length < 3
                            ? [...prev.selectedPolicies, policyId]
                            : prev.selectedPolicies;
                    
                    return {...prev, selectedPolicies: selected};
                });
            };

            const executeQuarter = () => {
                const selectedPoliciesData = POLICIES.filter(p => 
                    gameState.selectedPolicies.includes(p.id)
                );

                let newIndicators = {...gameState.indicators};

                // Apply policy impacts
                selectedPoliciesData.forEach(policy => {
                    Object.keys(policy.impacts).forEach(key => {
                        if (newIndicators[key] !== undefined) {
                            newIndicators[key] = Math.max(0, Math.min(100, 
                                newIndicators[key] + policy.impacts[key]
                            ));
                        }
                    });
                });

                // Calculate quarterly budget renewal (tax revenues)
                // Base renewal: 25% + bonus based on economic performance
                const baseRenewal = 25;
                const growthBonus = Math.max(0, newIndicators.croissance || 1.5) * 2;
                const employmentBonus = (newIndicators.emploi - 65) * 0.5;
                const totalRenewal = baseRenewal + growthBonus + employmentBonus;
                
                // Add quarterly revenues (capped at 150%)
                newIndicators.budget = Math.min(150, newIndicators.budget + totalRenewal);

                // Store quarterly revenue for display
                const quarterlyRevenue = Math.round(totalRenewal);

                // Recalculate derived indicators
                newIndicators.activite = Math.min(100, newIndicators.emploi + newIndicators.chomage / 2);
                
                // Random event (scenario-dependent probability)
                const eventProbability = gameState.scenario?.eventProbability || 0.3;
                const shouldTriggerEvent = Math.random() < eventProbability && gameState.quarter < gameState.totalQuarters;
                
                // Filter events by scenario
                const scenarioEvents = EVENTS.filter(e => 
                    !e.scenarios || e.scenarios.includes(gameState.scenario?.id)
                );
                const randomEvent = shouldTriggerEvent && scenarioEvents.length > 0
                    ? scenarioEvents[Math.floor(Math.random() * scenarioEvents.length)]
                    : null;

                if (randomEvent) {
                    Object.keys(randomEvent.impacts).forEach(key => {
                        if (newIndicators[key] !== undefined) {
                            newIndicators[key] = Math.max(0, Math.min(100,
                                newIndicators[key] + randomEvent.impacts[key]
                            ));
                        }
                    });
                }

                const newHistory = [...gameState.history, {
                    quarter: gameState.quarter,
                    policies: selectedPoliciesData,
                    indicators: newIndicators,
                    event: randomEvent,
                    quarterlyRevenue: quarterlyRevenue
                }];

                // Check for midterm report (after quarter 4)
                const isMidterm = gameState.quarter === 4;

                if (randomEvent) {
                    setGameState(prev => ({
                        ...prev,
                        indicators: newIndicators,
                        history: newHistory,
                        eventTriggered: randomEvent,
                        quarterlyRevenue: quarterlyRevenue,
                        phase: 'event'
                    }));
                } else if (isMidterm) {
                    // Quiz puis midterm
                    const doMidterm = () => setGameState(prev => ({
                        ...prev, indicators: newIndicators, history: newHistory,
                        quarterlyRevenue: quarterlyRevenue, phase: 'midterm'
                    }));
                    setGameState(prev => ({
                        ...prev, indicators: newIndicators, history: newHistory,
                        quarterlyRevenue: quarterlyRevenue
                    }));
                    showQuizBefore(doMidterm, selectedPoliciesData, null);
                } else if (gameState.quarter >= gameState.totalQuarters) {
                    setGameState(prev => ({
                        ...prev,
                        indicators: newIndicators,
                        history: newHistory,
                        phase: 'results',
                        completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id]
                    }));
                } else {
                    // Quiz puis trimestre suivant
                    const doNext = () => setGameState(prev => ({
                        ...prev,
                        quarter: prev.quarter + 1,
                        indicators: newIndicators,
                        history: newHistory,
                        selectedPolicies: [],
                        quarterlyRevenue: quarterlyRevenue,
                        phase: 'playing'
                    }));
                    setGameState(prev => ({
                        ...prev, indicators: newIndicators, history: newHistory,
                        quarterlyRevenue: quarterlyRevenue
                    }));
                    showQuizBefore(doNext, selectedPoliciesData, null);
                }
            };

            const continueAfterEvent = () => {
                const lastHistory = gameState.history[gameState.history.length - 1];
                const quarterlyRevenue = lastHistory?.quarterlyRevenue || 0;
                const isMidterm = gameState.quarter === 4;
                const policies = lastHistory?.policies || [];
                const event    = lastHistory?.event || null;

                const doTransition = () => {
                    if (isMidterm) {
                        setGameState(prev => ({...prev, phase: 'midterm'}));
                    } else if (gameState.quarter >= gameState.totalQuarters) {
                        setGameState(prev => ({
                            ...prev,
                            phase: 'results',
                            completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id]
                        }));
                    } else {
                        setGameState(prev => ({
                            ...prev,
                            quarter: prev.quarter + 1,
                            selectedPolicies: [],
                            eventTriggered: null,
                            phase: 'playing',
                            showRevenueNotification: quarterlyRevenue
                        }));
                    }
                };

                showQuizBefore(doTransition, policies, event);
            };

            const continueFromMidterm = () => {
                setGameState(prev => ({
                    ...prev,
                    quarter: prev.quarter + 1,
                    selectedPolicies: [],
                    phase: 'playing'
                }));
            };

            const resetGame = () => {
                localStorage.removeItem('ministre-travail-game');
                setGameState({...INITIAL_STATE, phase: 'scenario'});
            };

            const backToScenarios = () => {
                setGameState(prev => ({
                    ...INITIAL_STATE,
                    completedScenarios: prev.completedScenarios || [],
                    phase: 'scenario'
                }));
            };

            const calculateScore = () => {
                const final = gameState.indicators;
                const initial = gameState.scenario?.initialState || INITIAL_STATE.indicators;
                
                const chômageScore = Math.max(0, (initial.chomage - final.chomage) * 10);
                const emploiScore = Math.max(0, (final.emploi - initial.emploi) * 5);
                const budgetScore = Math.max(0, 100 - Math.abs(100 - final.budget));
                const equilibreScore = Math.max(0, 100 - Math.abs(final.entreprises - final.salaries));
                
                const totalScore = (chômageScore + emploiScore + budgetScore + equilibreScore) / 4;
                
                return {
                    total: Math.round(totalScore),
                    chomage: Math.round(chômageScore),
                    emploi: Math.round(emploiScore),
                    budget: Math.round(budgetScore),
                    equilibre: Math.round(equilibreScore)
                };
            };

            const getScoreClass = (score) => {
                if (score >= 80) return 'score-excellent';
                if (score >= 60) return 'score-good';
                if (score >= 40) return 'score-average';
                return 'score-poor';
            };

            const getScoreText = (score) => {
                if (score >= 80) return 'Excellent !';
                if (score >= 60) return 'Bien';
                if (score >= 40) return 'Moyen';
                return 'Insuffisant';
            };

            // Render different phases
            if (gameState.phase === 'scenario') {
                const completed = gameState.completedScenarios || [];
                const totalScenarios = Object.keys(SCENARIOS).length;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏛️ Conseil des Ministres</h1>
                            <p>Serious game — Thèmes 6.3, 6.4 & 7 — STMG Terminale</p>
                        </div>
                        <div style={{padding:'30px 40px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'10px'}}>
                                <div>
                                    <h2 style={{fontSize:'1.6em',color:'#2a5298',margin:0}}>Choisissez votre scénario</h2>
                                    <p style={{color:'#666',marginTop:'6px',fontSize:'0.95em'}}>6 contextes économiques — du plus facile au plus exigeant</p>
                                </div>
                                {completed.length > 0 && (
                                    <div style={{background:'#d4edda',border:'2px solid #28a745',borderRadius:'12px',padding:'10px 18px',textAlign:'center'}}>
                                        <div style={{fontSize:'1.4em',fontWeight:800,color:'#28a745'}}>{completed.length}/{totalScenarios}</div>
                                        <div style={{fontSize:'0.8em',color:'#155724'}}>scénarios terminés</div>
                                    </div>
                                )}
                            </div>

                            <div className="scenario-grid-6" style={{marginTop:'24px'}}>
                                {Object.values(SCENARIOS).map(scenario => {
                                    const isDone = completed.includes(scenario.id);
                                    const focus  = scenario.ministerFocus || {};
                                    return (
                                        <div
                                            key={scenario.id}
                                            className="scenario-card"
